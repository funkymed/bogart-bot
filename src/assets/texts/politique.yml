# Lexique Politique Française et Américaine pour Bogart Bot
# Utilisé pour le RAG (Retrieval Augmented Generation)

# Institutions françaises
institutions_fr:
  - La Ve République française a été fondée en 1958 par Charles de Gaulle avec une Constitution renforçant le pouvoir exécutif
  - Le Président de la République est élu pour 5 ans au suffrage universel direct depuis 2000 (auparavant 7 ans)
  - L'Assemblée nationale compte 577 députés élus pour 5 ans au scrutin uninominal majoritaire à deux tours
  - Le Sénat compte 348 sénateurs élus pour 6 ans au suffrage universel indirect par les grands électeurs
  - Le Premier ministre est nommé par le Président et dirige le gouvernement
  - Le Conseil constitutionnel vérifie la conformité des lois à la Constitution, composé de 9 membres
  - La cohabitation survient quand le Président et le Premier ministre sont de bords opposés
  - Le 49-3 permet au gouvernement de faire adopter un texte sans vote sauf motion de censure
  - La motion de censure nécessite 289 voix (majorité absolue) pour renverser le gouvernement
  - Le Conseil d'État est la plus haute juridiction administrative française

# Partis politiques français
partis_fr:
  - La République En Marche (Renaissance) est le parti d'Emmanuel Macron, libéral et pro-européen
  - Les Républicains (LR) sont le parti de droite héritier du RPR et de l'UMP
  - Le Parti Socialiste (PS) est le principal parti de gauche, affaibli depuis 2017
  - La France Insoumise (LFI) est le parti de gauche radicale fondé par Jean-Luc Mélenchon
  - Le Rassemblement National (RN) est le parti d'extrême droite de Marine Le Pen, ex-Front National
  - Europe Écologie Les Verts (EELV) est le parti écologiste français
  - Le Parti Communiste Français (PCF) existe depuis 1920, historiquement puissant mais en déclin
  - La NUPES (Nouvelle Union Populaire Écologique et Sociale) était l'alliance de gauche aux législatives 2022
  - Le clivage gauche-droite traditionnel s'est complexifié avec l'émergence du macronisme et du populisme

# Élections françaises
elections_fr:
  - L'élection présidentielle se déroule tous les 5 ans en deux tours (sauf majorité absolue au 1er tour)
  - Les législatives élisent les députés quelques semaines après la présidentielle
  - Les municipales élisent les conseils municipaux pour 6 ans au scrutin proportionnel (villes +1000 hab)
  - Les régionales élisent les conseils régionaux pour 6 ans au scrutin proportionnel à deux tours
  - Les européennes élisent les députés européens pour 5 ans au scrutin proportionnel de liste
  - Le référendum permet de soumettre un texte au vote direct des citoyens (rare depuis 2005)
  - Le vote blanc n'est pas comptabilisé dans les suffrages exprimés en France
  - Le parrainage exige 500 signatures d'élus pour se présenter à la présidentielle
  - La règle des 5% élimine les petits partis du second tour des législatives et régionales

# Institutions américaines
institutions_us:
  - Les États-Unis sont une République fédérale avec séparation stricte des pouvoirs (checks and balances)
  - Le Président est élu pour 4 ans (maximum 2 mandats) par un collège de 538 grands électeurs
  - Le Congrès est bicaméral : Chambre des Représentants (435 membres, 2 ans) et Sénat (100 sénateurs, 6 ans)
  - La Cour Suprême compte 9 juges nommés à vie par le Président avec confirmation du Sénat
  - Le système électoral américain est winner-takes-all dans chaque État (sauf Maine et Nebraska)
  - Le Vice-Président préside le Sénat et succède au Président en cas de vacance
  - Les mid-terms sont les élections de mi-mandat qui renouvellent le Congrès tous les 2 ans
  - L'impeachment permet au Congrès de destituer le Président (mise en accusation + procès au Sénat)
  - Le filibuster au Sénat permet de bloquer un vote par obstruction parlementaire (60 voix pour clore)
  - Le 25e amendement permet de destituer un Président inapte, jamais utilisé

# Partis politiques américains
partis_us:
  - Le Parti Démocrate est centre-gauche, pro-régulation, pro-État providence et droits civiques
  - Le Parti Républicain est conservateur, pro-marché libre, valeurs traditionnelles et souveraineté étatique
  - Le bipartisme américain est ancré dans le système électoral uninominal majoritaire à un tour
  - Les primaires permettent aux électeurs de choisir les candidats de chaque parti (caucus dans certains États)
  - Le Tea Party était un mouvement conservateur libertarien apparu en 2009 au sein du GOP
  - Le trumpisme a transformé le Parti Républicain avec un populisme nationaliste anti-establishment
  - Les Never Trumpers sont des Républicains opposés à Donald Trump
  - Bernie Sanders et AOC représentent l'aile progressiste du Parti Démocrate
  - Les swing states (États pivots) décident l'élection : Pennsylvanie, Wisconsin, Michigan, Arizona, Géorgie, Nevada

# Élections américaines
elections_us:
  - L'élection présidentielle a lieu tous les 4 ans le mardi suivant le premier lundi de novembre
  - Le collège électoral compte 538 grands électeurs, il faut 270 voix pour gagner
  - Les grands électeurs votent formellement en décembre, l'investiture a lieu le 20 janvier
  - Le vote populaire (popular vote) peut diverger du collège électoral (2000, 2016)
  - Les primaires débutent en Iowa et New Hampshire, durent plusieurs mois
  - La Super Tuesday regroupe les primaires de nombreux États le même jour (mars)
  - Les conventions nationales désignent officiellement les candidats en été
  - Les débats présidentiels sont organisés par une commission bipartisane
  - Le gerrymandering redécoupe les circonscriptions pour favoriser un parti
  - Le voter ID et l'accès au vote sont des enjeux politiques majeurs

# Concepts politiques
concepts:
  - La séparation des pouvoirs (Montesquieu) divise exécutif, législatif et judiciaire
  - Le suffrage universel accorde le droit de vote à tous les citoyens majeurs
  - La proportionnelle répartit les sièges selon les scores, le majoritaire donne tout au gagnant
  - Le scrutin uninominal élit un seul représentant par circonscription
  - Le scrutin de liste permet de voter pour une liste de candidats
  - La décentralisation transfère des compétences de l'État aux collectivités locales
  - Le fédéralisme partage le pouvoir entre gouvernement central et États fédérés
  - Le populisme oppose le peuple aux élites et prône la démocratie directe
  - La laïcité sépare l'État et les religions (concept français sans équivalent US strict)
  - Le lobbying influence les décisions politiques par des groupes d'intérêt

# Enjeux contemporains France
enjeux_fr:
  - La réforme des retraites a suscité de grandes manifestations en 2023 (passage à 64 ans)
  - L'immigration est un sujet clivant entre régulation stricte (droite) et accueil (gauche)
  - La dette publique française dépasse 110% du PIB, un enjeu budgétaire majeur
  - La transition écologique oppose croissance verte et décroissance
  - La souveraineté énergétique se pose après la guerre en Ukraine et la crise du gaz
  - La réindustrialisation vise à ramener la production en France
  - La sécurité et la lutte contre le terrorisme restent prioritaires
  - Les gilets jaunes en 2018-2019 ont exprimé une colère sociale et un rejet des élites
  - La réforme territoriale a fusionné les régions en 2016 (de 22 à 13)
  - Le Grand débat national en 2019 a suivi la crise des gilets jaunes

# Enjeux contemporains USA
enjeux_us:
  - L'avortement est redevenu un enjeu après l'annulation de Roe v. Wade en 2022 par la Cour Suprême
  - Le contrôle des armes à feu divise profondément avec le 2e amendement
  - L'immigration à la frontière mexicaine est un sujet politique explosif
  - La dette publique américaine dépasse 31 000 milliards de dollars
  - Les droits LGBTQ+ progressent mais sont contestés dans certains États conservateurs
  - Le mouvement Black Lives Matter a relancé le débat sur le racisme systémique
  - La polarisation politique atteint des sommets, avec des médias et réseaux sociaux en bulle
  - L'assaut du Capitole le 6 janvier 2021 a marqué une rupture démocratique
  - La Chine est perçue comme le rival stratégique numéro un
  - Le climat divise entre urgence climatique (démocrates) et priorité économique (républicains)

# Union Européenne
ue:
  - L'Union Européenne compte 27 États membres depuis le Brexit en 2020
  - Le Parlement européen est élu au suffrage universel direct, 705 députés
  - La Commission européenne propose les lois, un commissaire par pays
  - Le Conseil européen réunit les chefs d'État et de gouvernement
  - Le Conseil de l'UE (Conseil des ministres) vote les lois avec le Parlement
  - L'euro est la monnaie de 20 pays de la zone euro
  - L'espace Schengen permet la libre circulation sans frontières (27 pays)
  - Le Brexit a vu le Royaume-Uni quitter l'UE après un référendum en 2016
  - Les fonds européens financent cohésion, agriculture (PAC) et recherche
  - Le pacte vert européen vise la neutralité carbone en 2050
