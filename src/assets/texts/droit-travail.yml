# Lexique Droit du Travail pour Bogart Bot
# Utilisé pour le RAG (Retrieval Augmented Generation)

# Contrat de travail
contrat:
  - Le CDI (Contrat à Durée Indéterminée) est le contrat de travail par défaut sans date de fin
  - Le CDD (Contrat à Durée Déterminée) est limité dans le temps et ne peut excéder 18 mois (renouvellements inclus)
  - La période d'essai permet à l'employeur et au salarié de tester la relation de travail, durée variable selon la convention collective
  - Le contrat de travail doit mentionner : fonction, rémunération, lieu de travail, durée, convention collective applicable
  - La clause de non-concurrence limite la liberté du salarié après son départ, elle doit être limitée dans le temps et l'espace et donner lieu à une contrepartie financière
  - La clause de mobilité permet à l'employeur de modifier le lieu de travail dans une zone géographique définie
  - Le temps partiel est un contrat avec une durée inférieure à 35h/semaine, minimum 24h sauf dérogations
  - La rupture conventionnelle permet de rompre le CDI d'un commun accord avec indemnité et chômage

# Durée du travail
duree_travail:
  - La durée légale du travail est de 35 heures par semaine en France
  - Les heures supplémentaires au-delà de 35h sont majorées : 25% pour les 8 premières, 50% au-delà
  - Le temps de travail maximum est de 10h par jour et 48h par semaine (44h en moyenne sur 12 semaines)
  - Le repos quotidien obligatoire est de 11 heures consécutives minimum
  - Le repos hebdomadaire est de 24 heures consécutives minimum, généralement le dimanche
  - Les heures supplémentaires peuvent être compensées par du repos compensateur équivalent
  - Le forfait jours (cadres autonomes) fixe un nombre de jours travaillés annuels (généralement 218 jours)
  - L'astreinte est une période où le salarié doit être joignable pour intervenir, elle est rémunérée
  - Le temps de trajet domicile-travail n'est pas du temps de travail effectif sauf circonstances particulières

# Congés et absences
conges:
  - Les congés payés représentent 2,5 jours ouvrables par mois travaillé, soit 30 jours (5 semaines) par an
  - L'employeur fixe les dates de congés mais doit respecter un délai de prévenance d'un mois minimum
  - Le congé maternité est de 16 semaines minimum (6 avant + 10 après l'accouchement)
  - Le congé paternité est de 28 jours calendaires dont 4 jours obligatoires à prendre après la naissance
  - Le congé pour enfant malade permet de s'absenter 3 jours par an (5 jours si enfant de moins d'un an)
  - Les jours fériés sont au nombre de 11 en France, seul le 1er mai est obligatoirement chômé et payé
  - Le congé sabbatique permet de suspendre le contrat pour 6 à 11 mois après 36 mois d'ancienneté
  - Le compte épargne temps (CET) permet d'accumuler congés et heures non prises
  - L'arrêt maladie nécessite un certificat médical sous 48h, avec maintien partiel du salaire selon ancienneté

# Rémunération
remuneration:
  - Le SMIC est le salaire minimum légal, révisé chaque année (11,65€/h brut en 2024)
  - Le salaire brut inclut les cotisations sociales, le salaire net est celui perçu après déductions
  - Le 13ème mois est une prime équivalente à un mois de salaire, selon la convention collective
  - La prime d'ancienneté récompense la fidélité, son montant dépend de la convention collective
  - Les tickets restaurant sont exonérés de charges dans la limite de 7,18€ par titre (60% employeur max)
  - La participation aux bénéfices est obligatoire dans les entreprises de plus de 50 salariés
  - L'intéressement est facultatif et récompense les performances collectives de l'entreprise
  - Le bulletin de paie doit être remis chaque mois avec détail des cotisations et net à payer
  - Les avantages en nature (véhicule, logement) sont imposables et soumis à cotisations
  - L'égalité salariale homme-femme est obligatoire, à travail égal salaire égal

# Rupture du contrat
rupture:
  - La démission est à l'initiative du salarié, elle ne donne pas droit au chômage sauf cas exceptionnels
  - Le licenciement pour motif personnel nécessite une cause réelle et sérieuse (faute, insuffisance professionnelle)
  - Le licenciement économique nécessite des difficultés économiques ou mutation technologique
  - Le préavis de démission ou licenciement varie selon ancienneté et convention (1 à 3 mois généralement)
  - L'indemnité de licenciement est de 1/4 de mois par année d'ancienneté jusqu'à 10 ans, puis 1/3
  - Le licenciement pour faute grave prive le salarié de préavis et d'indemnité de licenciement
  - La faute lourde (intention de nuire) prive aussi de l'indemnité compensatrice de congés payés
  - La transaction est un accord à l'amiable après rupture qui clôt définitivement le litige
  - Le solde de tout compte récapitule les sommes dues lors du départ (salaire, congés, indemnités)
  - Le Pôle emploi verse l'allocation chômage après licenciement, rupture conventionnelle ou démission légitime

# Protection sociale
protection:
  - La Sécurité sociale rembourse les frais de santé à 70% (consultations) et 80% (hôpital)
  - La mutuelle d'entreprise est obligatoire et complète le remboursement de la Sécurité sociale
  - Les cotisations retraite sont prélevées sur le salaire brut pour financer les pensions
  - L'assurance chômage est financée par les cotisations patronales et couvre 57% à 75% du salaire
  - Les accidents du travail et maladies professionnelles sont pris en charge à 100% par la Sécu
  - La prévoyance couvre l'incapacité, l'invalidité et le décès au-delà de la Sécurité sociale
  - Le régime de retraite complémentaire (AGIRC-ARRCO) s'ajoute à la retraite de base
  - La portabilité permet de conserver mutuelle et prévoyance 12 mois après le départ de l'entreprise

# Représentation du personnel
representation:
  - Le CSE (Comité Social et Économique) remplace les anciens CE, DP et CHSCT depuis 2019
  - Le CSE est obligatoire dans les entreprises de 11 salariés minimum
  - Les délégués syndicaux représentent les syndicats dans l'entreprise de plus de 50 salariés
  - Le droit de grève est constitutionnel, la grève suspend le contrat sans le rompre
  - Les heures de délégation permettent aux représentants du personnel d'exercer leur mandat
  - Le délit d'entrave sanctionne l'employeur qui empêche le fonctionnement des institutions
  - Le licenciement d'un représentant du personnel nécessite l'autorisation de l'inspection du travail
  - Les accords d'entreprise peuvent déroger à la loi ou à la convention collective dans certains cas

# Santé et sécurité
sante_securite:
  - L'employeur a une obligation de sécurité de résultat envers ses salariés
  - Le document unique d'évaluation des risques (DUER) recense tous les risques professionnels
  - La visite médicale d'embauche doit être effectuée avant la prise de poste ou dans les 3 mois
  - Le harcèlement moral ou sexuel est interdit et sanctionné pénalement
  - Le droit de retrait permet au salarié de quitter son poste s'il estime sa vie en danger
  - Les arrêts de travail pour maladie professionnelle ou accident du travail sont indemnisés à 100%
  - L'inaptitude constatée par le médecin du travail oblige l'employeur à chercher un reclassement
  - Les troubles musculo-squelettiques (TMS) sont la première cause de maladie professionnelle
  - Le burn-out n'est pas reconnu comme maladie professionnelle mais peut être indemnisé

# Discrimination et égalité
discrimination:
  - Les discriminations à l'embauche ou au travail sont interdites (origine, sexe, âge, religion, etc.)
  - L'index de l'égalité professionnelle mesure les écarts homme-femme sur 100 points (obligatoire +50 salariés)
  - Le congé maternité et paternité ne peuvent entraîner aucune discrimination
  - Les travailleurs handicapés bénéficient de l'obligation d'emploi (6% des effectifs en entreprise +20 salariés)
  - L'âge ne peut être un critère de discrimination sauf exceptions légales (retraite, etc.)
  - Les lanceurs d'alerte sont protégés contre les représailles après signalement de faits illégaux
  - Le CV anonyme vise à lutter contre les discriminations à l'embauche
  - Les sanctions disciplinaires doivent être proportionnées et non discriminatoires
